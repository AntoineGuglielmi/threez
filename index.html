<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050607" />
    <meta name="description" content="Threez — prototype de jeu de survie en 3D isométrique." />
    <title>Threez — Prologue</title>
  </head>
  <body>
    <main class="game">
      <header class="hud">
        <a class="wordmark" href="/" aria-label="Threez, accueil"><span class="wordmark-mark">3</span> THREEZ</a>
        <div class="chapter"><span class="status-dot"></span> PROLOGUE <span class="chapter-divider">/</span> HÔPITAL</div>
        <div class="hud-right">PROTOTYPE <span class="hud-version">01</span></div>
      </header>
      <section class="scene" aria-label="Plateau de jeu en 3D">
        <div class="scene-grain"></div>
        <div class="scene-caption">
          <p class="eyebrow">OBJECTIF PRINCIPAL</p>
          <h1>Atteignez le toit.</h1>
          <p class="caption-copy">Explorez l'hôpital. Protégez le blessé.</p>
        </div>
        <div id="scene-root"></div>
        <div class="scene-footer">
          <span><span class="legend-swatch legend-start"></span> Départ · portes barricadées</span>
          <span class="grid-coordinates">BROUILLARD <b>VISIBILITÉ LIMITÉE</b></span>
        </div>
        <div class="tile-label" aria-hidden="true"><span class="tile-label-dot"></span> CASE DE DÉPART <b>CD</b></div>
      </section>
      <footer class="toolbar">
        <div class="toolbar-note"><span class="key">LMB</span> ORIENTER <span class="key">MOLETTE</span> ZOOMER</div>
        <div class="toolbar-message">LE GROUPE EST À L'ABRI… POUR L'INSTANT.</div>
        <div class="toolbar-build">THREE.JS <span>×</span> THREEZ</div>
      </footer>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
