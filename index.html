<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050607" />
    <meta name="description" content="Threez — prototype de jeu de survie en 3D isométrique." />
    <title>Threez — Prologue</title>
  </head>
  <body>
    <main class="game">
      <section class="scene" aria-label="Plateau de jeu en 3D">
        <div id="scene-root"></div>
        <div id="placement-actions" class="placement-actions" hidden role="group" aria-label="Actions de placement">
          <button id="rotate-ghost" type="button" aria-label="Tourner le couloir" title="Tourner le couloir">↻</button>
          <button id="confirm-ghost" type="button" aria-label="Valider la pose" title="Valider la pose">✓</button>
        </div>
        <div class="camera-controls" role="group" aria-label="Rotation du plateau">
          <button id="rotate-left" type="button" aria-label="Pivoter le plateau vers la gauche" title="Pivoter vers la gauche">↶</button>
          <button id="rotate-right" type="button" aria-label="Pivoter le plateau vers la droite" title="Pivoter vers la droite">↷</button>
        </div>
        <aside id="game-ui" class="game-panel" aria-label="État de la partie">
          <section class="turn-summary" aria-label="Joueur actif et actions">
            <div class="active-player">
              <span class="active-player-avatar" aria-hidden="true"><span></span></span>
              <span class="active-player-name"><strong>Furtif</strong><small>JOUEUR ACTIF · TOUR <span id="active-player-turn">01</span></small></span>
            </div>
            <div class="actions-remaining" aria-label="Actions restantes">
              <strong id="actions-count">7</strong><span>ACTIONS</span>
            </div>
          </section>
          <div class="actions-track" aria-hidden="true"><div id="actions-fill"></div></div>
          <p id="phase-label" class="phase-label">Phase 1 — Compléter la main à 3 couloirs</p>



          <section class="room-exploration" aria-label="Actions dans la pièce" hidden>
            <div class="section-heading"><h2>Pièce actuelle</h2></div>
            <p id="room-state" class="room-state"></p>
            <div id="room-result" class="room-result" aria-live="polite"></div>
            <div id="cp-door-options" class="cp-door-options"></div>
            <button id="unlock-room" class="action-button primary" hidden>Déverrouiller · 1 action</button>
            <button id="return-room" class="action-button subtle" hidden>Retour au couloir · 1 action</button>
          </section>

          <section class="hand-disclosure" aria-label="Couloirs en main">
            <div class="sidebar-section-heading"><h2>Couloirs en main</h2></div>
            <div id="cc-hand" class="cc-hand"></div>
            <div class="game-actions">
              <button id="place-cc" class="action-button primary" disabled hidden>Valider la pose</button>
              <button id="rotate-cc" class="action-button" disabled hidden>Tourner</button>
              <button id="cancel-placement" class="action-button subtle" disabled hidden>Annuler</button>
              <button id="discard-cc" class="action-button subtle" disabled>Défausser la pioche</button>
              <button id="replace-cc" class="action-button subtle" disabled>Remplacer un couloir en main</button>
            </div>
          </section>

          <section class="inventory-disclosure" aria-label="Ressources">
            <div class="sidebar-section-heading"><h2>Ressources</h2><strong>Inventaire</strong></div>
            <div class="resource-grid">
              <span>Café <b id="resource-cafe">0</b></span>
              <span>Croissant <b id="resource-croissant">0</b></span>
              <span>Citron <b id="resource-citron">0</b></span>
              <span>Bonbon acidulé <b id="resource-bonbon">0</b></span>
              <span>Munition <b id="resource-munition">0</b></span>
            </div>
          </section>
          <button id="end-turn" class="end-turn">Terminer le tour <span>↗</span></button>
          <button id="reset-game" class="reset-button" type="button">Réinitialiser la partie</button>
        </aside>
        <aside class="deck-piles" aria-label="Pioches">
          <div id="draw-cc" class="deck-stack deck-stack-corridor" role="button" tabindex="0" aria-label="Piocher des cartes Couloir" aria-disabled="false">
            <span class="deck-stack-card deck-stack-card-back" aria-hidden="true"></span>
            <span class="deck-stack-card deck-stack-card-middle" aria-hidden="true"></span>
            <span class="deck-stack-card deck-stack-card-loose" aria-hidden="true"></span>
            <span class="deck-stack-card deck-stack-card-top">Couloir</span>
          </div>
          <div id="draw-cp" class="deck-stack deck-stack-room" role="button" tabindex="0" aria-label="Piocher des cartes Pièce" aria-disabled="false">
            <span class="deck-stack-card deck-stack-card-back" aria-hidden="true"></span>
            <span class="deck-stack-card deck-stack-card-middle" aria-hidden="true"></span>
            <span class="deck-stack-card deck-stack-card-top">Pièce</span>
          </div>
        </aside>
        <aside id="room-hover-card" class="room-hover-card" aria-live="polite" hidden></aside>
        <div class="tile-label" aria-hidden="true"><span class="tile-label-dot"></span> DÉPART <b>CD</b></div>
      </section>
    </main>
    <script type="module">if (location.pathname === "/pixelart") { await import("/src/pixelart.ts") } else { await import("/src/main.ts") }</script>
  </body>
</html>
